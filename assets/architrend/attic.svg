<svg xmlns="http://www.w3.org/2000/svg" width="660" height="300" viewBox="0 0 660 300" role="img" aria-labelledby="t d"><title id="t">小屋裏に接する天井とは</title><desc id="d">屋根の下にある空間が小屋裏。その下の天井に断熱性能と小屋裏の温度を設定します。1階と2階の間の天井とは区別します。</desc>
<g font-family="Yu Gothic,Meiryo,sans-serif" font-size="17" fill="#294a41"><path d="M40 115 185 18 330 115" fill="#f3e2ce" stroke="#55756a" stroke-width="5" stroke-linejoin="round"/><path d="M63 113h244v164H63z" fill="#f0f6f2" stroke="#55756a" stroke-width="3"/><path d="M65 111h240" stroke="#de7952" stroke-width="10"/><path d="M65 200h240" stroke="#aebeb5" stroke-width="5"/><text x="185" y="86" text-anchor="middle">小屋裏</text><text x="185" y="163" text-anchor="middle">2階の部屋</text><text x="185" y="249" text-anchor="middle">1階の部屋</text>
<g fill="none" stroke="#7f978a" stroke-width="1.5"><path d="m249 60 84-21h30"/><path d="M267 110h96"/><path d="M265 200h98"/></g><text x="375" y="45">屋根の下の空間</text><text x="375" y="102" fill="#b24b2b" font-weight="700">ここに設定します</text><text x="375" y="131" font-size="15">天井のU値 ＋ 小屋裏の温度</text><text x="375" y="198" font-size="15">階の間の天井とは別です</text><text x="375" y="225" font-size="14" fill="#617369">図は仕組みを説明する例です。</text><text x="375" y="248" font-size="14" fill="#617369">実際の断熱位置を確認してください。</text></g></svg>
